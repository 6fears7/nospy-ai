name: Release

# Push a tag like v0.1.0 (or v0.1.0-rc.1 for a pre-release) to test the code and publish:
#   - binary archives for linux, macOS and Windows on amd64 and arm64, with SHA256SUMS
#   - the multi-arch container image at ghcr.io/<owner>/nospy-ai
#   - the Helm chart as an OCI artifact at ghcr.io/<owner>/charts/nospy-ai
#   - a GitHub Release with generated notes and build provenance attestations for the files
# The tag without its "v" is the image tag, so it matches the Helm chart's appVersion.
# A final release (no -suffix) also moves the image tags 1.2 and latest.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag $TAG is not vMAJOR.MINOR.PATCH[-prerelease]" >&2
            exit 1
          fi
          # A final release must tag a tree whose chart already says the same version, so a source
          # install of the tag matches what was published. Pre-releases are exempt.
          appver="$(sed -n 's/^appVersion: "\(.*\)"/\1/p' deploy/helm/nospy/Chart.yaml)"
          if [[ "$TAG" != *-* && "$appver" != "${TAG#v}" ]]; then
            echo "Chart.yaml appVersion is $appver but the tag is $TAG: bump Chart.yaml (version, appVersion) and nospy.appVersion in _helpers.tpl first" >&2
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ "$TAG" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  binaries:
    needs: [ci, version]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          exe=nospy; [ "$GOOS" = windows ] && exe=nospy.exe
          mkdir -p "stage/nospy-ai_${VERSION}_${GOOS}_${GOARCH}" dist
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o "stage/nospy-ai_${VERSION}_${GOOS}_${GOARCH}/$exe" ./cmd/nospy
      - name: Check the version stamp
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          out="$("stage/nospy-ai_${VERSION}_linux_amd64/nospy" version)"
          echo "$out"
          [[ "$out" == "nospy ${VERSION} "* ]]
      - name: Package
        run: |
          name="nospy-ai_${VERSION}_${GOOS}_${GOARCH}"
          cp LICENSE README.md "stage/$name/"
          cd stage
          if [ "$GOOS" = windows ]; then
            zip -qr "../dist/$name.zip" "$name"
          else
            tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$(git log -1 --format=%ct)" \
              -czf "../dist/$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  image:
    needs: [ci, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nospy-ai
          # latest only for a final release; flavor latest=false stops the action guessing.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.version.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}

  chart:
    needs: [version, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      # The chart's default image is the local dev name, and its default tag comes from a helper that
      # --app-version does not touch. Pin both in the published chart to the image released above.
      # The chart is published as nospy-ai like the repo; the source directory and templates stay nospy.
      - name: Package
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          sed -i \
            -e "s#^  repository: nospy\$#  repository: ghcr.io/${owner}/nospy-ai#" \
            -e "s#^  tag: \"\"#  tag: \"${VERSION}\"#" \
            deploy/helm/nospy/values.yaml
          sed -i "s#^name: nospy\$#name: nospy-ai#" deploy/helm/nospy/Chart.yaml
          grep -q "repository: ghcr.io/${owner}/nospy-ai" deploy/helm/nospy/values.yaml
          grep -q "tag: \"${VERSION}\"" deploy/helm/nospy/values.yaml
          grep -q "^name: nospy-ai\$" deploy/helm/nospy/Chart.yaml
          mkdir dist
          helm package deploy/helm/nospy --version "$VERSION" --app-version "$VERSION" --destination dist
      - name: Push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/nospy-ai-${VERSION}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-chart
          path: dist/*.tgz
          if-no-files-found: error

  release:
    needs: [version, binaries, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Publish release
        env:
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" dist/* --title "nospy-ai $TAG" --generate-notes --verify-tag "${flags[@]}"
