{{- if eq .Values.mode "service" }}
{{- include "nospy.validateService" . }}
{{- $ctx := dict "Values" .Values "sidecar" false "Release" .Release }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nospy.fullname" . }}
  labels:
    {{- include "nospy.labels" . | nindent 4 }}
spec:
  replicas: {{ int .Values.replicas }}
  selector:
    matchLabels:
      {{- include "nospy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nospy.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "nospy.fullname" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ add (int .Values.shutdownTimeoutSeconds) 10 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        {{- include "nospy.container" $ctx | nindent 8 }}
      {{- $vols := include "nospy.volumes" $ctx | trim }}
      {{- if $vols }}
      volumes:
        {{- $vols | nindent 8 }}
      {{- end }}
{{- end }}
