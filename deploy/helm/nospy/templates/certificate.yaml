{{- if and (eq .Values.mode "service") ((.Values.tls.certManager).issuerRef).name }}
{{- /* cert-manager writes tls.secretName (validated in nospy.validateService); every replica mounts that one Secret, so peers present the same leaf. */}}
{{- $name := include "nospy.fullname" . }}
{{- $ns := .Release.Namespace }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}
  labels:
    {{- include "nospy.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.tls.secretName | quote }}
  issuerRef:
    {{- toYaml .Values.tls.certManager.issuerRef | nindent 4 }}
  usages: [digital signature, key encipherment, server auth]
  dnsNames:
    - {{ $name }}
    - {{ printf "%s.%s" $name $ns }}
    - {{ printf "%s.%s.svc" $name $ns }}
    - {{ printf "%s.%s.svc.cluster.local" $name $ns }}
    {{- range .Values.tls.certManager.dnsNames }}
    - {{ . | quote }}
    {{- end }}
{{- end }}
